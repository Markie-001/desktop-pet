name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build for Windows
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --icon assets/icon.png --name DesktopPet --add-data "assets;assets" pet.py

      - name: Build for Mac
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --icon assets/icon.png --name DesktopPet --add-data "assets:assets" pet.py
          cd dist && zip -r DesktopPet-mac.zip DesktopPet.app

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopPet.exe
            dist/DesktopPet-mac.zip